<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaptureHub — Nota Condivisa</title>
  <style>
    :root {
      --md-surface: #fdfbff;
      --md-surface-container: #f3effa;
      --md-surface-container-high: #ebe6f4;
      --md-on-surface: #1b1b1f;
      --md-on-surface-variant: #46464f;
      --md-primary: #4f5b92;
      --md-on-primary: #ffffff;
      --md-primary-container: #dce1ff;
      --md-on-primary-container: #06164b;
      --md-secondary-container: #dfe1f9;
      --md-on-secondary-container: #171b2c;
      --md-outline: #c7c5d0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-surface: #131318;
        --md-surface-container: #1f1f25;
        --md-surface-container-high: #2a2930;
        --md-on-surface: #e4e1e9;
        --md-on-surface-variant: #c7c5d0;
        --md-primary: #b7c4ff;
        --md-on-primary: #1f2b60;
        --md-primary-container: #374379;
        --md-on-primary-container: #dce1ff;
        --md-secondary-container: #434659;
        --md-on-secondary-container: #dfe1f9;
        --md-outline: #46464f;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--md-surface);
      color: var(--md-on-surface);
      line-height: 1.6;
      min-height: 100vh;
    }

    .top-banner {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border-bottom: 1px solid var(--md-outline);
      padding: 14px 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .banner-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .banner-text {
      flex: 1 1 300px;
    }

    .banner-title {
      font-weight: 700;
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .banner-sub {
      font-size: 0.85rem;
      opacity: 0.88;
      margin-top: 2px;
    }

    .banner-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }

    .btn-tonal {
      background: var(--md-surface);
      color: var(--md-on-surface);
    }

    .container {
      max-width: 820px;
      margin: 28px auto 64px;
      padding: 0 20px;
    }

    .note-card {
      background: var(--md-surface-container);
      border-radius: 28px;
      padding: 32px 28px;
      border: 1px solid var(--md-outline);
      position: relative;
      overflow: hidden;
    }

    .note-header {
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--md-outline);
    }

    .note-title {
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .note-meta {
      font-size: 0.85rem;
      color: var(--md-on-surface-variant);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .readonly-pill {
      display: inline-block;
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .note-body {
      position: relative;
    }

    .block-p {
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .block-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .block-check input {
      margin-top: 5px;
      width: 17px;
      height: 17px;
      accent-color: var(--md-primary);
    }

    .checked-text {
      text-decoration: line-through;
      opacity: 0.58;
    }

    .block-quote {
      border-left: 4px solid var(--md-primary);
      background: var(--md-surface-container-high);
      padding: 12px 16px;
      border-radius: 0 14px 14px 0;
      margin: 12px 0;
      font-style: italic;
    }

    .block-code {
      background: #1a1c23;
      color: #e6edf3;
      padding: 14px 16px;
      border-radius: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88rem;
      overflow-x: auto;
      margin: 12px 0;
    }

    .block-table-wrap {
      overflow-x: auto;
      margin: 14px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid var(--md-outline);
      padding: 9px 12px;
      text-align: left;
      font-size: 0.92rem;
    }

    th {
      background: var(--md-surface-container-high);
      font-weight: 700;
    }

    .block-images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .block-images img {
      width: 100%;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid var(--md-outline);
    }

    .block-divider {
      border: none;
      border-top: 1px solid var(--md-outline);
      margin: 18px 0;
    }

    .block-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--md-surface-container-high);
      color: var(--md-primary);
      text-decoration: none;
      font-weight: 600;
      margin: 10px 0;
    }

    .ink-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .notice-omitted {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--md-surface-container-high);
      color: var(--md-on-surface-variant);
      font-size: 0.85rem;
    }

    .error-state {
      text-align: center;
      padding: 48px 16px;
    }
  </style>
</head>
<body>
  <header class="top-banner">
    <div class="banner-inner">
      <div class="banner-text">
        <div class="banner-title">✨ CaptureHub • Nota condivisa in sola lettura</div>
        <div class="banner-sub">
          Vuoi salvare questa nota per sempre, modificarla, disegnare o usare l'AI offline? Scarica l'app gratuita CaptureHub!
        </div>
      </div>
      <div class="banner-actions">
        <a id="openAppBtn" href="capturehub://note" class="btn btn-tonal">Apri nell'app</a>
        <a href="#download" onclick="alert('Installa l\'APK di CaptureHub o scarica l\'app per importare questa nota direttamente sul tuo dispositivo!'); return false;" class="btn btn-primary">Scarica CaptureHub</a>
      </div>
    </div>
  </header>

  <main class="container">
    <article id="noteCard" class="note-card">
      <div class="error-state" id="loadingState">Caricamento nota condivisa...</div>
    </article>
  </main>

  <script>
    async function inflateUrlSafe(encoded) {
      let b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4 !== 0) b64 += '=';
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const ds = new DecompressionStream('deflate');
      const writer = ds.writable.getWriter();
      writer.write(bytes);
      writer.close();
      const out = await new Response(ds.readable).text();
      return JSON.parse(out);
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function renderInkSvg(inkLayer) {
      if (!inkLayer || !inkLayer.page || !Array.isArray(inkLayer.page.strokes) || inkLayer.page.strokes.length === 0) {
        return '';
      }
      const h = inkLayer.page.height || 1000;
      let paths = '';
      for (const s of inkLayer.page.strokes) {
        if (!s.points || s.points.length === 0) continue;
        const d = s.points.map((p, idx) => `${idx === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        const colorInt = (s.color >>> 0);
        const a = ((colorInt >> 24) & 0xFF) / 255;
        const r = (colorInt >> 16) & 0xFF;
        const g = (colorInt >> 8) & 0xFF;
        const b = colorInt & 0xFF;
        const strokeColor = `rgba(${r},${g},${b},${(a * (s.opacity ?? 1)).toFixed(2)})`;
        paths += `<path d="${d}" fill="none" stroke="${strokeColor}" stroke-width="${s.width || 4}" stroke-linecap="round" stroke-linejoin="round" />`;
      }
      return `<svg class="ink-overlay" viewBox="0 0 1000 ${h}" preserveAspectRatio="xMidYMin slice">${paths}</svg>`;
    }

    function renderNote(pkg) {
      const card = document.getElementById('noteCard');
      const dateStr = new Date(pkg.timestamp || Date.now()).toLocaleDateString('it-IT', {
        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      let bodyHtml = '';
      let inkOverlayHtml = '';

      try {
        const parsed = JSON.parse(pkg.content);
        if (parsed && parsed.isRichNote && Array.isArray(parsed.blocks)) {
          for (const b of parsed.blocks) {
            if (b.type === 'ink') {
              inkOverlayHtml += renderInkSvg(b);
            } else if (b.type === 'paragraph') {
              const style = [
                b.isBold ? 'font-weight:700' : '',
                b.isItalic ? 'font-style:italic' : '',
                b.isUnderline ? 'text-decoration:underline' : '',
                b.isStrikethrough ? 'text-decoration:line-through' : '',
                b.indentLevel ? `margin-left:${b.indentLevel * 22}px` : ''
              ].filter(Boolean).join(';');
              if (b.listType === 'CHECK') {
                bodyHtml += `<div class="block-check" style="margin-left:${(b.indentLevel || 0) * 22}px">
                  <input type="checkbox" disabled ${b.isChecked ? 'checked' : ''} />
                  <span class="${b.isChecked ? 'checked-text' : ''}" style="${style}">${escapeHtml(b.text)}</span>
                </div>`;
              } else if (b.listType === 'BULLET') {
                bodyHtml += `<p class="block-p" style="${style}">• ${escapeHtml(b.text)}</p>`;
              } else {
                bodyHtml += `<p class="block-p" style="${style}">${escapeHtml(b.text)}</p>`;
              }
            } else if (b.type === 'quote') {
              bodyHtml += `<blockquote class="block-quote">${escapeHtml(b.text)}</blockquote>`;
            } else if (b.type === 'code') {
              bodyHtml += `<pre class="block-code"><code>${escapeHtml(b.code)}</code></pre>`;
            } else if (b.type === 'divider') {
              bodyHtml += `<hr class="block-divider" />`;
            } else if (b.type === 'link') {
              bodyHtml += `<a class="block-link" href="${escapeHtml(b.url)}" target="_blank" rel="noopener">🔗 ${escapeHtml(b.title || b.url)}</a>`;
            } else if (b.type === 'table') {
              const cols = (b.columns || []).map(c => `<th>${escapeHtml(c)}</th>`).join('');
              const rows = (b.rows || []).map(r => `<tr>${r.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('');
              bodyHtml += `<div class="block-table-wrap"><table><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table></div>`;
            } else if (b.type === 'image') {
              const uris = (b.uris && b.uris.length ? b.uris : (b.uri ? [b.uri] : []))
                .filter(u => u.startsWith('data:image/') || u.startsWith('https://'));
              if (uris.length > 0) {
                bodyHtml += `<div class="block-images">${uris.map(u => `<img src="${u}" alt="${escapeHtml(b.caption)}" />`).join('')}</div>`;
              }
            }
          }
        } else {
          bodyHtml = `<p class="block-p">${escapeHtml(pkg.content)}</p>`;
        }
      } catch {
        bodyHtml = `<p class="block-p">${escapeHtml(pkg.content || pkg.note || '')}</p>`;
      }

      const omittedNotice = pkg.hasOmittedMedia
        ? `<div class="notice-omitted">📎 Alcuni file multimediali pesanti o registrazioni audio originali sono stati omessi dal link rapido. Apri in CaptureHub o richiedi un'esportazione PDF per i file completi.</div>`
        : '';

      card.innerHTML = `
        <header class="note-header">
          <h1 class="note-title">${escapeHtml(pkg.title || 'Nota condivisa')}</h1>
          <div class="note-meta">
            <span>${escapeHtml(dateStr)}</span>
            <span class="readonly-pill">Sola visualizzazione</span>
          </div>
        </header>
        <div class="note-body">
          ${bodyHtml || '<p class="block-p"><i>Nota senza contenuto testuale.</i></p>'}
          ${inkOverlayHtml}
        </div>
        ${omittedNotice}
      `;
    }

    (async () => {
      const hash = window.location.hash || '';
      const query = new URLSearchParams(window.location.search);
      const encoded = hash.startsWith('#d=') ? hash.slice(3) : (query.get('d') || '');

      if (encoded) {
        document.getElementById('openAppBtn').href = `capturehub://note?d=${encodeURIComponent(encoded)}`;
      }

      if (!encoded) {
        document.getElementById('noteCard').innerHTML = `
          <div class="error-state">
            <h2>Nessuna nota trovata nel link</h2>
            <p style="margin-top:8px;opacity:0.75;">Verifica che il link condiviso da CaptureHub sia completo.</p>
          </div>`;
        return;
      }

      try {
        const pkg = await inflateUrlSafe(encoded);
        renderNote(pkg);
      } catch (err) {
        document.getElementById('noteCard').innerHTML = `
          <div class="error-state">
            <h2>Impossibile leggere la nota</h2>
            <p style="margin-top:8px;opacity:0.75;">Il link potrebbe essere danneggiato o incompleto.</p>
          </div>`;
      }
    })();
  </script>
</body>
</html>
